# Battery report interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Keyboard debounce settings
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# Increase BLE radio transmit power to improve latency and communication between halves
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Custom keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Lily58"
# Fix battery report errors in Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# OLED display configuration
CONFIG_ZMK_DISPLAY=y
#CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n
# Enable WPM status widget
#CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
# Bongo cat typing animation
#CONFIG_ZMK_WIDGET_BONGO_CAT=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Sleep configuration
# Enter idle state after 10 minutes of inactivity (in milliseconds)
CONFIG_ZMK_IDLE_TIMEOUT=600000
# Enable deep sleep 
CONFIG_ZMK_SLEEP=y
# Enter deep sleep after 15 minutes of inactivity (in milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK Studio settings
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# Auto-disable RGB when idle
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# Rotary encoder (EC11) configuration
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
